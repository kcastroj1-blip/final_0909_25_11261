<!DOCTYPE html>
<html lang="es"
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de descuentos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="contenedor"
<h1>"calculadora de descuentos</h1>

<div class="campo">
     <label for="precioOriginal">Precio original (Q):</label>
            <input type="number" id="precioOriginal" placeholder="150" min="0" step="0.01">
        </div>

<div class="campo">
     <label for="precioOriginal">Porcentaje de descuentos (%):</label>
            <input type="number" id="porcentajeDescuento" placeholder="150" min="0" step="0.01">
        </div>

        <button id="btnCalcular">aplicar descuentos</button>
        <div id="resultado" class="resultado"></div>
    </main>
    <script src="scripts.js"></script>


</body>
</html>
